<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Packet Tracer Management</title>
    <!-- Prevent FOUC Theme Script -->
    <script>
        (function() {
            const saved = localStorage.getItem('pt_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --pt-primary: #4f46e5;
            --pt-primary-hover: #4338ca;
            --pt-primary-light: rgba(79, 70, 229, 0.08);
            --pt-bg: #f8fafc;
            --pt-card-bg: #ffffff;
            --pt-border: #e2e8f0;
            --pt-text: #0f172a;
            --pt-text-muted: #64748b;
            --pt-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --pt-radius: 12px;
        }

        [data-bs-theme="dark"] {
            --pt-bg: #090d16;
            --pt-card-bg: #131c2e;
            --pt-border: #1e293b;
            --pt-text: #f8fafc;
            --pt-text-muted: #94a3b8;
            --pt-primary-light: rgba(79, 70, 229, 0.15);
            --pt-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5), 0 10px 15px -8px rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--pt-bg);
            color: var(--pt-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Subtle background radial glow */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            height: 400px;
            background: radial-gradient(circle at center, rgba(79, 70, 229, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-card {
            background-color: var(--pt-card-bg);
            border: 1px solid var(--pt-border);
            border-radius: var(--pt-radius);
            box-shadow: var(--pt-shadow);
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .theme-toggle-corner {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 10;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--pt-border);
            border-radius: 8px;
            padding: 0.35rem 0.65rem;
            color: var(--pt-text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            color: var(--pt-primary);
            border-color: var(--pt-primary);
            background-color: var(--pt-primary-light);
        }

        .brand-icon-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pt-primary) 0%, #3730a3 100%);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            margin-bottom: 1rem;
        }

        .form-floating > .form-control {
            border-color: var(--pt-border);
            border-radius: 8px;
            background-color: var(--pt-card-bg);
            color: var(--pt-text);
        }

        .form-floating > .form-control:focus {
            border-color: var(--pt-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
        }

        .btn-submit {
            background: var(--pt-primary);
            border: none;
            color: #ffffff;
            padding: 0.75rem 1rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--pt-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            color: #ffffff;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--pt-text-muted);
            cursor: pointer;
            z-index: 5;
            padding: 4px;
        }

        .password-toggle-btn:hover {
            color: var(--pt-text);
        }
    </style>
</head>
<body>

    <!-- Theme Toggle in Corner -->
    <div class="theme-toggle-corner">
        <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
            <i class="bi bi-moon-stars" id="theme-toggle-icon"></i>
        </button>
    </div>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon-wrapper">
                <i class="bi bi-diagram-3-fill"></i>
            </div>
            <h4 class="fw-bold mb-1">PacketTracer</h4>
            <div class="text-muted small">Lab Administration &amp; Management Portal</div>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-4 rounded-3 border-0 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
            <div><strong>Access Denied:</strong> {{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
                <label for="username"><i class="bi bi-person me-1"></i> Username</label>
            </div>

            <div class="position-relative mb-4">
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password"><i class="bi bi-lock me-1"></i> Password</label>
                </div>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide password">
                    <i class="bi bi-eye" id="password-toggle-icon"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-submit mb-3">
                <span>Sign In to Portal</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="text-center pt-3 border-top mt-2">
            <span class="badge bg-body-secondary text-secondary border px-3 py-2 font-monospace" style="font-size: 0.76rem;">
                <i class="bi bi-shield-lock me-1"></i> Default: ptadmin / IlovePT
            </span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', next);
            localStorage.setItem('pt_theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-toggle-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-stars';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
            updateThemeIcon(current);
        });
    </script>
</body>
</html>
