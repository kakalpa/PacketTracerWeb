services:
  mariadb:
    image: mariadb:latest
    container_name: guacamole-mariadb
    restart: unless-stopped
    networks:
      - ptnet
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_DATABASE: 'guacamole_db'
      MARIADB_USER: 'ptdbuser'
      MARIADB_PASSWORD: 'ptdbpass'
    volumes:
      - ./db-dump.sql:/docker-entrypoint-initdb.d/db-dump.sql:ro
      - mariadb_data:/var/lib/mysql

  guacd:
    image: guacamole/guacd
    container_name: pt-guacd
    restart: unless-stopped
    networks:
      - ptnet

  guacamole:
    image: guacamole/guacamole
    container_name: pt-guacamole
    restart: unless-stopped
    networks:
      - ptnet
    depends_on:
      - mariadb
      - guacd
    environment:
      MYSQL_DATABASE: 'guacamole_db'
      MYSQL_USER: 'ptdbuser'
      MYSQL_PASSWORD: 'ptdbpass'
      MYSQL_HOST: mariadb
      REMOTE_IP_VALVE_ENABLED: 'true'
      PROXY_ALLOWED_IPS_REGEX: '172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|127\.0\.0\.1'

  nginx:
    image: pt-nginx:latest
    build:
      context: ./pt-nginx
      dockerfile: Dockerfile
    container_name: pt-nginx1
    restart: unless-stopped
    networks:
      - ptnet
    depends_on:
      - guacamole
      - pt-management
    ports:
      - "80:80"
      - "443:443"
      - "5000:5000"
    volumes:
      - ./pt-nginx/www:/usr/share/nginx/html:ro
      - ./pt-nginx/conf:/etc/nginx/conf.d:ro
      - ./pt-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../ssl:/etc/ssl/ptweb:ro
      - ../certbot/conf:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro
      - ../geoip/GeoIP.dat:/usr/share/GeoIP/GeoIP.dat:ro
      - ../shared:/shared:ro

  pt-certbot:
    image: pt-certbot:latest
    build:
      context: ./pt-certbot
      dockerfile: Dockerfile
    container_name: pt-certbot
    restart: unless-stopped
    networks:
      - ptnet
    volumes:
      - ../certbot/conf:/etc/letsencrypt:rw
      - ../certbot/www:/var/www/certbot:rw
      - ../.env:/app/.env:ro

  pt-management:
    image: pt-management:latest
    build:
      context: ../pt-management
      dockerfile: Dockerfile
    container_name: pt-management
    restart: unless-stopped
    networks:
      - ptnet
    depends_on:
      - mariadb
      - guacamole
    expose:
      - "5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../shared:/shared
      - ../.env:/app/.env
      - ..:/project
      - ../certbot/conf:/etc/letsencrypt:rw
      - ../certbot/www:/var/www/certbot:rw
    environment:
      PTADMIN_PASSWORD: '${PTADMIN_PASSWORD:-IlovePT}'
      DB_HOST: mariadb
      DB_USER: ptdbuser
      DB_PASSWORD: ptdbpass
      DB_NAME: guacamole_db
      PROJECT_ROOT: /project
      SHARED_HOST_PATH: '${SHARED_HOST_PATH:?Set absolute host path to shared directory in .env}'
      ENABLE_HTTPS: '${ENABLE_HTTPS:-true}'
      STANDALONE_SSL: 'false'

networks:
  ptnet:
    name: ptnet
    driver: bridge
    # Don't recreate if it exists - allows manual additions
    external: false

volumes:
  mariadb_data:
    name: mariadb_data
